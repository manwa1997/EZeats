version: '3.8'

services:
  auth-service:
    build:
      context: ./auth-service
    ports:
      - "3000:3000"
    env_file:
      - ./auth-service/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    depends_on:
      - db
    networks:
      - ezeats-net
    restart: always

  order-service:
    build:
      context: ./order-service
    ports:
      - "3001:3001"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=root
      - DATABASE_PASSWORD=1234
      - DATABASE_NAME=zeat
    depends_on:
      - db
    networks:
      - ezeats-net
    restart: always

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=zeat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ezeats-net
    restart: always

networks:
  ezeats-net:

volumes:
  postgres-data:
