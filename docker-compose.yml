
services:
  auth-service:
    build:
      context: ./auth-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://root:1234@db:5432/ezeat
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    depends_on:
      - db
    networks:
      - ezeats-net
    env_file:
      - ./auth-service/.env
    restart: always

  order-service:
    build:
      context: ./order-service
    ports:
      - "3001:3001"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=root
      - DATABASE_PASSWORD=1234
      - DATABASE_NAME=ezeat
    depends_on:
      - db
    networks:
      - ezeats-net
    restart: always

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ezeat
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - ezeats-net
    restart: always

volumes:
  db-data:

networks:
  ezeats-net:
